[project]
name = "arxiv-neutrino"
version = "0.2.0"
description = "Daily digest of neutrino-physics papers from arXiv with LLM summaries"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi<0.120.0",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "starlette<1.0.0",
    "uvicorn>=0.46.0",
]

[project.scripts]
arxiv-fetch = "arxivnu.fetch:main"
arxiv-apply = "arxivnu.apply:main"
arxiv-backfill = "arxivnu.backfill:main"
arxiv-exclude = "arxivnu.exclude:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arxivnu"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
